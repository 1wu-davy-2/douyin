services:
  douyin:
    build: .
    container_name: douyin-archive
    ports:
      - "8787:8787" # Web 界面与 API 监听 8787
    volumes:
      - douyin-data:/app/data
      # 下载根目录:固定到宿主机 /opt/douyin/down(目录不存在时由下方命令自动创建)
      - ${DOWNLOAD_ROOT:-/opt/douyin/down}:/app/data/downloads
    environment:
      DY_PORT: "8787"
      # 容器内必须监听 0.0.0.0,否则 Docker 端口映射后外部 connection refused
      DY_BIND: "0.0.0.0"
      DY_DATA_DIR: /app/data
      DY_SIDECAR_PYTHON: python3
      # 默认下载根 = 挂载的宿主机目录(网页设置的 download_root 仍可覆盖)
      DY_DOWNLOAD_ROOT: /app/data/downloads
      # 下载总容量上限(GB),0 = 不限制。可用环境变量调整
      DY_DOWNLOAD_LIMIT_GB: "20"
      # 火花引擎(续火花):未启用 spark profile 时留空 → /api/spark/* 返回 503 空态
      DY_SPARK_URL: "${DY_SPARK_URL:-http://spark-engine:18788}"
      DY_SPARK_TOKEN: "${DY_SPARK_TOKEN:-}"
    restart: unless-stopped

  # 可选:火花引擎(--profile spark 启用,见 docs/HUOHUA_EXECUTION_PLAN.md §8)
  spark-engine:
    build: { context: ./spark-engine, dockerfile: Dockerfile }
    container_name: spark-engine
    profiles: ["spark"]
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPARK_ENGINE_PORT: "18788"
      # 必填:与 DY_SPARK_TOKEN 同值(写在 .env),引擎凭它拒绝无 token 请求
      SPARK_ENGINE_TOKEN: ${DY_SPARK_TOKEN:?set_DY_SPARK_TOKEN_in_.env}
    volumes:
      - spark-state:/app/state

  # 可选:本地 MinIO(配合设置页的 MinIO 同步)
  # minio:
  #   image: minio/minio
  #   command: server /data --console-address ":9001"
  #   ports: ["9000:9000", "9001:9001"]
  #   volumes: ["./minio-data:/data"]
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin

volumes:
  douyin-data:
  spark-state:
